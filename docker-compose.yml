# Starts the database and the API:  docker compose up --build
# API on http://localhost:8081 (8080 is often taken by XAMPP/Apache on Windows)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/jobtracker
      DB_USERNAME: jobtracker
      DB_PASSWORD: jobtracker
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
