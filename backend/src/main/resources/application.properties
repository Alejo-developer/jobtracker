spring.application.name=jobtracker-api

# Database: defaults match docker-compose.yml; override with environment variables in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:jobtracker}
spring.datasource.password=${DB_PASSWORD:jobtracker}

# Flyway owns the schema; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Return RFC 9457 problem details for errors
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info

# Comma-separated origins allowed to call the API (the Vite dev server by default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
